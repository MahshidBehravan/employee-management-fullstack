<h2>Employee Management</h2>

@if (loading()) {
  <p>Loading employees...</p>
} @else if (error()) {
  <p>{{ error() }}</p>
} @else {
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Salary</th>
      </tr>
    </thead>
    <tbody>
      @for (employee of employees(); track employee.id) {
        <tr>
          <td>{{ employee.id }}</td>
          <td>{{ employee.name }}</td>
          <td>{{ employee.salary }}</td>
        </tr>
      } @empty {
        <tr>
          <td colspan="3">No employees found.</td>
        </tr>
      }
    </tbody>
  </table>
}
